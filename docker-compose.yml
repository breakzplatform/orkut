services:
  orkut:
    build: .
    container_name: orkut
    restart: unless-stopped
    # Bound to the host loopback ONLY, on an uncommon port. Nothing is exposed
    # to the LAN/internet — the host-level cloudflared reaches it via 127.0.0.1.
    ports:
      - "127.0.0.1:41401:4001"
    volumes:
      # Host dir holding .env, supporters.json, cursor.txt and labels.db*.
      # Seed it once with the production backup before first start.
      - ./data:/data
    healthcheck:
      # Any HTTP response on the labeler route means the server is listening.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/xrpc/com.atproto.label.queryLabels?uriPatterns=*').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
